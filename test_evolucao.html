<!DOCTYPE html>
<html>
<head>
    <title>Teste Evolução Completo</title>
</head>
<body>
    <h1>Teste Completo de Salvamento de Evolução</h1>
    <div id="status">Aguardando...</div>
    <div id="logs" style="max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-top: 10px;"></div>
    
    <script>
        function log(message) {
            console.log(message);
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML += '<p style="margin: 5px 0; font-family: monospace; font-size: 12px;">' + message + '</p>';
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        
        async function registrarUsuario() {
            try {
                log('Tentando registrar usuário de teste...');
                
                const response = await fetch('/api/auth/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: 'teste_user',
                        senha: 'teste123',
                        nome_completo: 'Usuário de Teste',
                        cpf: '12345678901',
                        crp: 'CRP-01/12345',
                        email: 'teste@teste.com'
                    })
                });
                
                log('Status do registro: ' + response.status);
                
                const responseText = await response.text();
                log('Resposta do registro: ' + responseText);
                
                if (response.status === 201 || response.status === 200) {
                    log('Usuário registrado com sucesso!');
                    return true;
                } else if (response.status === 400 && responseText.includes('já está em uso')) {
                    log('Usuário já existe, continuando com o teste...');
                    return true;
                } else {
                    log('Erro no registro: ' + responseText);
                    return false;
                }
                
            } catch (error) {
                log('Erro ao registrar usuário: ' + error.message);
                return false;
            }
        }
        
        async function fazerLogin() {
            try {
                log('Tentando fazer login...');
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: 'teste_user',
                        senha: 'teste123'
                    })
                });
                
                log('Status do login: ' + response.status);
                
                const responseText = await response.text();
                log('Resposta do login: ' + responseText);
                
                if (!response.ok) {
                    log('Erro no login');
                    return null;
                }
                
                const result = JSON.parse(responseText);
                log('Login bem-sucedido! Token obtido.');
                log('ID do usuário: ' + result.usuario.id);
                return { token: result.token, usuarioId: result.usuario.id };
                
            } catch (error) {
                log('Erro ao fazer login: ' + error.message);
                return null;
            }
        }
        
        async function criarPacienteTeste(token, usuarioId) {
            try {
                log('Criando paciente de teste...');
                
                const response = await fetch('/api/pacientes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nome: 'Paciente de Teste',
                        cpf: '98765432100',
                        data_nascimento: '1990-01-01',
                        telefone: '11999999999',
                        email: 'paciente@teste.com'
                    })
                });
                
                log('Status da criação do paciente: ' + response.status);
                
                const responseText = await response.text();
                log('Resposta da criação do paciente: ' + responseText);
                
                if (response.ok) {
                    const result = JSON.parse(responseText);
                    log('Paciente criado com ID: ' + result.id);
                    return result.id;
                } else if (response.status === 400 && responseText.includes('já está cadastrado')) {
                    log('Paciente já existe, buscando ID...');
                    // Tentar buscar o paciente existente
                    const buscarResponse = await fetch('/api/pacientes', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (buscarResponse.ok) {
                        const pacientes = await buscarResponse.json();
                        const pacienteTeste = pacientes.find(p => p.cpf === '98765432100');
                        if (pacienteTeste) {
                            log('Paciente encontrado com ID: ' + pacienteTeste.id);
                            return pacienteTeste.id;
                        }
                    }
                }
                
                log('Não foi possível criar/encontrar paciente, usando ID padrão 1');
                return 1;
                
            } catch (error) {
                log('Erro ao criar paciente: ' + error.message);
                return 1;
            }
        }
        
        async function testarSalvamentoEvolucao(token, pacienteId) {
            try {
                log('Testando salvamento de evolução...');
                log('Paciente ID: ' + pacienteId);
                
                const formData = new FormData();
                formData.set('paciente_id', pacienteId.toString());
                formData.set('titulo', 'Teste de Evolução Completo');
                formData.set('data_hora', '2024-01-20T14:30:00');
                formData.set('observacao', 'Esta é uma evolução de teste para verificar se o erro foi corrigido após todas as correções aplicadas.');
                
                log('Dados preparados:');
                for (let [key, value] of formData.entries()) {
                    log('  ' + key + ': ' + value);
                }
                
                const response = await fetch('/api/evolucoes', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                log('Status da resposta: ' + response.status);
                
                const responseText = await response.text();
                log('Resposta bruta: ' + responseText);
                
                if (!response.ok) {
                    try {
                        const error = JSON.parse(responseText);
                        log('ERRO DA API: ' + JSON.stringify(error, null, 2));
                    } catch (e) {
                        log('ERRO (não JSON): ' + responseText);
                    }
                    return false;
                }
                
                try {
                    const result = JSON.parse(responseText);
                    log('SUCESSO! Evolução salva: ' + JSON.stringify(result, null, 2));
                    return true;
                } catch (e) {
                    log('Sucesso, mas resposta não é JSON: ' + responseText);
                    return true;
                }
                
            } catch (error) {
                log('ERRO no teste de salvamento: ' + error.message);
                return false;
            }
        }
        
        async function executarTesteCompleto() {
            try {
                document.getElementById('status').innerHTML = 'Executando teste completo...';
                
                // 1. Registrar usuário
                const registroOk = await registrarUsuario();
                if (!registroOk) {
                    document.getElementById('status').innerHTML = 'Falha no registro';
                    return;
                }
                
                // 2. Fazer login
                const loginResult = await fazerLogin();
                if (!loginResult) {
                    document.getElementById('status').innerHTML = 'Falha no login';
                    return;
                }
                
                // 3. Criar paciente
                const pacienteId = await criarPacienteTeste(loginResult.token, loginResult.usuarioId);
                
                // 4. Testar salvamento
                const sucesso = await testarSalvamentoEvolucao(loginResult.token, pacienteId);
                
                if (sucesso) {
                    document.getElementById('status').innerHTML = '✅ TESTE CONCLUÍDO COM SUCESSO!';
                    log('=== TESTE FINALIZADO COM SUCESSO ===');
                } else {
                    document.getElementById('status').innerHTML = '❌ TESTE FALHOU - verifique os logs';
                    log('=== TESTE FALHOU ===');
                }
                
            } catch (error) {
                log('ERRO GERAL no teste: ' + error.message);
                document.getElementById('status').innerHTML = '❌ Erro: ' + error.message;
            }
        }
        
        // Executar teste quando a página carregar
        window.onload = function() {
            log('Página carregada, iniciando teste completo em 2 segundos...');
            setTimeout(executarTesteCompleto, 2000);
        };
    </script>
</body>
</html>
