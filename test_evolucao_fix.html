<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Nova Evolução - Correção</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Teste de Nova Evolução - Correção</h1>
    <div id="logs"></div>
    <button onclick="executarTeste()">Executar Teste</button>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            logsDiv.appendChild(logDiv);
            console.log(message);
        }

        async function executarTeste() {
            try {
                log('Iniciando teste de Nova Evolução...', 'info');
                
                // 1. Registrar usuário de teste
                log('Registrando usuário de teste...', 'info');
                const usuarioTeste = 'teste_evolucao_' + Date.now();
                const registroResponse = await fetch('/api/auth/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: usuarioTeste,
                        senha: '123456',
                        nome_completo: 'Usuário Teste Evolução',
                        cpf: '12345678901',
                        crp: 'CRP-01/12345',
                        email: 'teste_evolucao@teste.com',
                        data_nascimento: '1990-01-01'
                    })
                });
                
                if (!registroResponse.ok) {
                    const errorData = await registroResponse.json();
                    log(`Erro no registro: ${errorData.mensagem}`, 'error');
                    return;
                }
                
                log('Usuário registrado com sucesso!', 'success');
                
                // 2. Fazer login
                log('Fazendo login...', 'info');
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: usuarioTeste,
                        senha: '123456'
                    })
                });
                
                if (!loginResponse.ok) {
                    const errorData = await loginResponse.json();
                    log(`Erro no login: ${errorData.mensagem}`, 'error');
                    return;
                }
                
                const loginData = await loginResponse.json();
                const token = loginData.token;
                log('Login realizado com sucesso!', 'success');
                
                // 3. Criar paciente de teste
                log('Criando paciente de teste...', 'info');
                const pacienteResponse = await fetch('/api/pacientes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        nome_completo: 'Paciente Teste Evolução',
                        cpf: '98765432100',
                        data_nascimento: '1985-05-15',
                        telefone: '(11) 99999-9999',
                        email: 'paciente_teste@teste.com'
                    })
                });
                
                if (!pacienteResponse.ok) {
                    const errorData = await pacienteResponse.json();
                    log(`Erro ao criar paciente: ${errorData.mensagem}`, 'error');
                    return;
                }
                
                const pacienteData = await pacienteResponse.json();
                const pacienteId = pacienteData.id;
                log(`Paciente criado com sucesso! ID: ${pacienteId}`, 'success');
                
                // 4. Testar salvamento de evolução com paciente_id correto
                log('Testando salvamento de evolução...', 'info');
                
                const formData = new FormData();
                formData.append('paciente_id', pacienteId);
                formData.append('titulo', 'Evolução de Teste');
                formData.append('observacao', 'Esta é uma evolução de teste para verificar se o erro foi corrigido.');
                formData.append('data_hora', '2024-01-15T14:30:00');
                
                log(`Dados da evolução: paciente_id=${pacienteId}, titulo=Evolução de Teste, observacao=Esta é uma evolução de teste...`, 'info');
                
                const evolucaoResponse = await fetch('/api/evolucoes', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!evolucaoResponse.ok) {
                    const errorData = await evolucaoResponse.json();
                    log(`Erro ao salvar evolução: ${errorData.mensagem}`, 'error');
                    return;
                }
                
                const evolucaoData = await evolucaoResponse.json();
                log(`Evolução salva com sucesso! ID: ${evolucaoData.id}`, 'success');
                
                // 5. Verificar se a evolução foi salva corretamente
                log('Verificando evolução salva...', 'info');
                const verificacaoResponse = await fetch(`/api/evolucoes/paciente/${pacienteId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!verificacaoResponse.ok) {
                    log('Erro ao verificar evolução salva', 'error');
                    return;
                }
                
                const evolucoes = await verificacaoResponse.json();
                log(`Evoluções encontradas: ${evolucoes.length}`, 'success');
                
                if (evolucoes.length > 0) {
                    log('✅ TESTE CONCLUÍDO COM SUCESSO! O erro foi corrigido.', 'success');
                } else {
                    log('❌ Evolução não foi encontrada após salvamento', 'error');
                }
                
            } catch (error) {
                log(`Erro durante o teste: ${error.message}`, 'error');
                console.error('Erro completo:', error);
            }
        }
        
        // Executar teste automaticamente ao carregar a página
        window.onload = () => {
            setTimeout(executarTeste, 1000);
        };
    </script>
</body>
</html>
